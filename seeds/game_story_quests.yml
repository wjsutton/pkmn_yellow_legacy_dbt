version: 2

seeds:
  - name: game_story_quests
    description: >
      Story quest chain for the agent's quest builder (dbtPlaysPokemon
      agent/planner/quest_builder.py). Item LOCATIONS live in item_locations;
      this seed encodes only what locations can't: chain order, the NPC/dialog
      trigger, and the observable completion check (complete_when_key/value map
      onto agent goal_manager.check_subgoal_complete keys).
    config:
      column_types:
        quest_order: integer
        requires_badges: integer
        complete_when_value: varchar # mixed domain: '0' | 'PARCEL' | 'true' — never let seed inference coerce it
    columns:
      - name: quest_name
        tests: [not_null, unique]
      - name: quest_order
        tests: [not_null]
      - name: complete_when_key
        tests: [not_null]
