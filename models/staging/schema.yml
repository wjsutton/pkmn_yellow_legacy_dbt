version: 2

models:
  - name: stg_game_route_order
    description: "Game progression route order mapping with next gym information for level cap determination"
    columns:
        - name: map
          description: "Route or location name (e.g. Route1, PalletTown, VictoryRoad)"
          tests:
            - unique
            - not_null
        - name: game_order
          description: "Sequential numeric order of progression through the game (1 = earliest, higher = later)"
          tests:
            - not_null
            - unique
        - name: next_gym
          description: "Next gym leader or game stage that follows this route (e.g. Badge_1, Badge_2, Elite_Four)"
          tests:
            - not_null

  - name: stg_map_locations
    description: "Geographic coordinate data for map locations used in Tableau visualizations"
    columns:
        - name: map
          description: "Route or location name matching stg_game_route_order"
          tests:
            - not_null
        - name: x_coordinate
          description: "X coordinate for map visualization"
        - name: y_coordinate
          description: "Y coordinate for map visualization"
        - name: location_type
          description: "Type of location (route, town, dungeon, etc.)"

  - name: stg_moves_from_level_up
    description: "Pokemon moves learned through level progression with power and accuracy stats"
    columns:
        - name: id
          description: "Unique identifier generated from pokedex number, level, and move"
          tests:
            - unique
            - not_null
        - name: pokemon
          description: "Pokemon species name"
          tests:
            - not_null
            - relationships:
                to: ref('stg_pkmn_stats')
                field: pokemon
        - name: pkmn_level
          description: "Level at which the pokemon learns this move"
          tests:
            - not_null
        - name: move
          description: "Move name"
          tests:
            - relationships:
                to: ref('stg_moves_stats')
                field: move
            - not_null
        - name: type
          description: "Move type (Fire, Water, Electric, etc.)"
          tests:
            - not_null
        - name: power
          description: "Base power of the move (N/A for status moves)"
        - name: accuracy
          description: "Move accuracy percentage"
        - name: pp
          description: "Power Points - number of times move can be used"
          tests:
            - not_null

  - name: stg_moves_from_tmhm
    description: "Pokemon moves available through TM (Technical Machine) or HM (Hidden Machine) items"
    columns:
        - name: id
          description: "Unique identifier generated from pokedex number and move"
          tests:
            - unique
            - not_null
        - name: pokedex
          description: "Pokedex number of the pokemon"
          tests:
            - not_null
        - name: pokemon
          description: "Pokemon species name"
          tests:
            - not_null
            - relationships:
                to: ref('stg_pkmn_stats')
                field: pokemon
        - name: move
          description: "TM/HM move name"
          tests:
            - relationships:
                to: ref('stg_moves_stats')
                field: move
            - not_null

  - name: stg_moves_phys_spec
    description: "Move type classification for physical vs special attack stat usage in Generation 1 mechanics"
    columns:
        - name: id
          description: "Unique identifier for each move type"
          tests:
            - unique
            - not_null
        - name: type
          description: "Move type (Fire, Water, Electric, etc.)"
          tests:
            - not_null
            - unique
        - name: stat_used
          description: "Which stat the move uses for damage calculation (Attack for physical, Special for special)"
          tests:
            - not_null
            - accepted_values:
                values: ['Attack', 'Special']

  - name: stg_moves_stats
    description: "Comprehensive move statistics including power, accuracy, PP, and special effects"
    columns:
        - name: id
          description: "Unique identifier generated from move name"
          tests:
            - unique
            - not_null
        - name: move
          description: "Move name"
          tests:
            - not_null
            - unique
        - name: effect
          description: "Move effect description (e.g. 'Inflicts regular damage', 'May cause paralysis')"
        - name: type
          description: "Move type (Fire, Water, Electric, etc.)"
          tests:
            - not_null
        - name: power
          description: "Base power of the move (N/A for status moves, KO for OHKO moves)"
          tests:
            - not_null
        - name: acc
          description: "Move accuracy as percentage or decimal"
          tests:
            - not_null
        - name: pp
          description: "Power Points - number of times move can be used"
          tests:
            - not_null
        - name: hits
          description: "Number of hits for multi-hit moves"
        - name: hits_min
          description: "Minimum number of hits for variable multi-hit moves"
        - name: hits_max
          description: "Maximum number of hits for variable multi-hit moves"
        - name: critical_hit_ratio
          description: "Critical hit ratio modifier for moves with increased crit chance"

  - name: stg_moves_tmhm_locations
    description: "Location and availability information for TM and HM items throughout the game"
    columns:
        - name: tm_or_hm
          description: "TM or HM identifier (e.g. TM01, HM01)"
          tests:
            - unique
            - not_null
        - name: move
          description: "Move taught by this TM/HM"
          tests:
            - not_null
            - relationships:
                to: ref('stg_moves_stats')
                field: move
        - name: earliest_nearest_route
          description: "First route where this TM/HM can be obtained"
          tests:
            - not_null
            - relationships:
                to: ref('stg_game_route_order')
                field: map
        - name: repurchase_route
          description: "Route where this TM can be repurchased (same as earliest for single-use TMs)"
          tests:
            - not_null
            - relationships:
                to: ref('stg_game_route_order')
                field: map

  - name: stg_moves_type_effectiveness 
    description: "Type effectiveness multipliers for Generation 1 battle calculations (e.g. Fire vs Water = 0.5x)"
    columns:
        - name: id
          description: "Unique identifier for each type matchup"
          tests:
            - unique
            - not_null
        - name: attacking_type
          description: "Type of the attacking move"
          tests:
            - not_null
        - name: defending_type
          description: "Type of the defending pokemon"
          tests:
            - not_null
        - name: damage_modifier
          description: "Damage multiplier (0=immune, 0.5=not very effective, 1=normal, 2=super effective)"
          tests:
            - not_null
            - accepted_values:
                values: [0, 0.5, 1, 2]

  - name: stg_pkmn_encounter_area_order
    description: "Mapping of encounter areas to routes for determining pokemon availability timing"
    columns:
        - name: id
          description: "Unique identifier for each encounter area mapping"
          tests:
            - unique
            - not_null
        - name: encounter_area
          description: "Specific encounter area name (e.g. Route1Grass, ViridianeForest)"
          tests:
            - not_null
        - name: map
          description: "Route or location name where this encounter area exists"
          tests:
            - relationships:
                to: ref('stg_game_route_order')
                field: map
            - not_null
        - name: game_order
          description: "Sequential order when this encounter area becomes available"
          tests:
            - not_null

  - name: stg_pkmn_encounter_areas
    description: "Wild pokemon encounter data with levels and probability rates for each area"
    columns:
        - name: id
          description: "Unique identifier for each pokemon encounter record"
          tests:
            - unique
            - not_null
        - name: map
          description: "Route or location name"
          tests:
            - relationships:
                to: ref('stg_game_route_order')
                field: map
            - not_null
        - name: pkmn_level
          description: "Level of wild pokemon encounter"
          tests:
            - not_null
        - name: pokemon
          description: "Pokemon species name"
          tests:
            - not_null
            - relationships:
                to: ref('stg_pkmn_stats')
                field: pokemon
        - name: area
          description: "Specific encounter area (Grass, Water, Cave, etc.)"
          tests:
            - not_null
        - name: encounter_probability
          description: "Probability of encountering this pokemon (summed across all encounter methods)"
          tests:
            - not_null

  - name: stg_pkmn_evolutions
    description: "Pokemon evolution relationships with level and stone requirements from seed data"
    columns:
        - name: id
          description: "Unique identifier for each evolution relationship"
          tests:
            - unique
            - not_null
        - name: pokedex
          description: "Pokedex number of the base (pre-evolution) pokemon"
          tests:
            - not_null
        - name: pokemon
          description: "Base pokemon species name (the pokemon that evolves)"
          tests:
            - not_null
            - relationships:
                to: ref('stg_pkmn_stats')
                field: pokemon
        - name: evolution_level
          description: "Level required for evolution (null for stone evolutions)"
        - name: evolution_stone
          description: "Stone required for evolution (null for level evolutions)"
        - name: evolution_name
          description: "Evolved pokemon species name (null for final evolution forms)"
          tests:
            - relationships:
                to: ref('stg_pkmn_stats')
                field: pokemon

  - name: stg_pkmn_stats
    description: "Base stats for all pokemon species including HP, Attack, Defense, Special, Speed, and typing"
    columns:
        - name: pokedex
          description: "Pokedex number (unique identifier for each pokemon species)"
          tests:
            - unique
            - not_null
        - name: pokemon
          description: "Pokemon species name"
          tests:
            - not_null
            - unique
        - name: hp
          description: "Base HP stat used in Generation 1 stat calculations"
          tests:
            - not_null
        - name: attack
          description: "Base Attack stat for physical move damage"
          tests:
            - not_null
        - name: defense
          description: "Base Defense stat for physical damage reduction"
          tests:
            - not_null
        - name: special
          description: "Base Special stat for special attack and defense in Generation 1"
          tests:
            - not_null
        - name: speed
          description: "Base Speed stat for turn order determination"
          tests:
            - not_null
        - name: total
          description: "Base stat total (sum of all base stats)"
          tests:
            - not_null
        - name: type1
          description: "Primary pokemon type"
          tests:
            - not_null
        - name: type2
          description: "Secondary pokemon type (null for single-type pokemon)"

  - name: stg_trainers_gym_leaders
    description: "Gym leader pokemon rosters with levels, moves, and battle context information"
    columns:
        - name: id
          description: "Unique identifier for each gym leader pokemon"
          tests:
            - unique
            - not_null
        - name: trainer
          description: "Gym leader name (Brock, Misty, Lt. Surge, etc.)"
          tests:
            - not_null
        - name: pkmn_id
          description: "Unique identifier for this specific pokemon instance"
          tests:
            - not_null
        - name: location
          description: "Gym location where battle takes place"
          tests:
            - not_null
        - name: nearest_route
          description: "Route used for game progression order mapping"
          tests:
            - not_null
            - relationships:
                to: ref('stg_game_route_order')
                field: map
        - name: pokemon
          description: "Pokemon species name"
          tests:
            - not_null
            - relationships:
                to: ref('stg_pkmn_stats')
                field: pokemon
        - name: game_stage
          description: "Game progression stage (Badge_1, Badge_2, etc.)"
          tests:
            - not_null
        - name: pkmn_level
          description: "Pokemon level in gym battle"
          tests:
            - not_null
        - name: move
          description: "One of the pokemon's four moves (unpivoted in downstream models)"
          tests:
            - not_null
            - relationships:
                to: ref('stg_moves_stats')
                field: move
        - name: notes
          description: "Additional context or special notes about this battle"

  - name: stg_trainers_legendary
    description: "Legendary trainer battles (primarily Smith encounters) with pokemon rosters and context"
    columns:
        - name: id
          description: "Unique identifier for each legendary trainer pokemon"
          tests:
            - unique
            - not_null
        - name: trainer
          description: "Legendary trainer name (primarily Smith from Pokemon Yellow Legacy)"
          tests:
            - not_null
        - name: pkmn_id
          description: "Unique identifier for this specific pokemon instance"
          tests:
            - not_null
        - name: location
          description: "Location where legendary battle takes place"
          tests:
            - not_null
        - name: nearest_route
          description: "Route used for game progression order mapping"
          tests:
            - not_null
            - relationships:
                to: ref('stg_game_route_order')
                field: map
        - name: pokemon
          description: "Pokemon species name"
          tests:
            - not_null
            - relationships:
                to: ref('stg_pkmn_stats')
                field: pokemon
        - name: game_stage
          description: "Game progression stage when battle occurs"
          tests:
            - not_null
        - name: pkmn_level
          description: "Pokemon level in legendary battle"
          tests:
            - not_null
        - name: move
          description: "One of the pokemon's four moves (unpivoted in downstream models)"
          tests:
            - not_null
            - relationships:
                to: ref('stg_moves_stats')
                field: move
        - name: notes
          description: "Additional context about this legendary encounter"

  - name: stg_trainers_mandatory
    description: "Mandatory trainer battles that must be completed for game progression (rivals, story battles)"
    columns:
        - name: trainer
          description: "Trainer name (rival encounters, story trainers, etc.)"
          tests:
            - not_null
        - name: pkmn_id
          description: "Unique identifier for this specific pokemon instance"
          tests:
            - not_null
            - unique
        - name: location
          description: "Location where mandatory battle takes place"
          tests:
            - not_null
        - name: nearest_route
          description: "Route used for game progression order mapping"
          tests:
            - not_null
            - relationships:
                to: ref('stg_game_route_order')
                field: map
        - name: pokemon
          description: "Pokemon species name"
          tests:
            - not_null
            - relationships:
                to: ref('stg_pkmn_stats')
                field: pokemon
        - name: game_stage
          description: "Game progression stage when battle occurs"
          tests:
            - not_null
        - name: pkmn_level
          description: "Pokemon level in mandatory battle"
          tests:
            - not_null
        - name: notes
          description: "Additional context about this mandatory encounter"

