version: 2

models:
  - name: int_pokemon_availability
    description: "What pokemon are available at each game stage? Covers catchable pokemon, trades, evolution by level/stone, with game progression level caps."
    columns:
        - name: id
          description: "Unique identifier for each pokemon availability record"
        - name: availability_type
          description: "How pokemon is obtained (Catchable, Team Option)"
        - name: pokemon
          description: "Pokemon species name"
        - name: initial_pokemon
          description: "Base pokemon that this pokemon evolves from (same as pokemon for base forms)"
        - name: encounter_level
          description: "Level at which pokemon is encountered in wild (null for evolutions)"
        - name: level_cap
          description: "Maximum level allowed at this game stage"
        - name: map
          description: "Map/location where pokemon is available"
        - name: area
          description: "Specific area within the map (Grass, Water, Cave, Evolution, Stone Evolution)"
        - name: earliest_route
          description: "Numeric order of first route where pokemon becomes available"
        - name: game_stage
          description: "Game stage when pokemon becomes available (Badge_1, Badge_2, etc.)"
        - name: source
          description: "Detailed source of availability (Wild Encounter, Level Evolution, Available from <map> for stone evolutions, Base Pokemon, etc.)"
        - name: pokemon_category
          description: "Categorization of pokemon availability (Wild Pokemon, Evolved Form, etc.)"
        - name: evolution_stage
          description: "Evolution stage (0 = base, 1 = first evolution, 2 = second evolution)"

  - name: int_pokemon_movesets
    description: "What moveset could each pokemon have? Consolidates level-up moves, repurchasable TM moves, and single-use TM moves with full stats."
    columns:
        - name: id
          description: "Unique identifier for each pokemon-move-source combination"
        - name: pokemon
          description: "Pokemon species name"
        - name: move
          description: "Move name"
        - name: pkmn_level
          description: "Level required for level-up moves (null for TM/HM moves)"
        - name: move_origin
          description: "Source of move availability (level-up, repurchasable-tm, single-use-tm)"
        - name: route_order
          description: "Route order when TM/HM becomes available (null for level-up moves)"
        - name: game_stage
          description: "Game stage when TM/HM becomes available (null for level-up moves)"
        - name: location_details
          description: "Descriptive text about TM/HM availability location"
        - name: move_type
          description: "Move type (Fire, Water, Electric, etc.)"
        - name: move_power
          description: "Base power of the move"
        - name: move_accuracy
          description: "Move accuracy"
        - name: move_pp
          description: "Power Points for the move"
        - name: move_hits
          description: "Number of hits for multi-hit moves"
        - name: move_hits_min
          description: "Minimum hits for variable multi-hit moves"
        - name: move_hits_max
          description: "Maximum hits for variable multi-hit moves"
        - name: critical_hit_ratio
          description: "Critical hit ratio for the move"
        - name: move_stat_used
          description: "Which stat the move uses (Attack or Special)"

  - name: int_opponent_pokemon
    description: "What opponent pokemon will we face? Complete trainer rosters with movesets per game stage."
    columns:
        - name: trainer
          description: "Name of the trainer"
        - name: is_mini_boss
          description: "Flag indicating if trainer is a mini boss (1) or regular trainer (0). Mini bosses include gym leaders, rivals, Elite 4, and other boss trainers."
        - name: game_stage
          description: "Game stage when this trainer is encountered"
        - name: game_order
          description: "Numeric game progression order"
        - name: notes
          description: "Additional context about trainer encounter"
        - name: pkmn_id
          description: "Unique identifier for trainer pokemon instance"
        - name: pokedex
          description: "Pokedex number"
        - name: pokemon
          description: "Pokemon species name"
        - name: pkmn_level
          description: "Pokemon level in battle"
        - name: move_1
          description: "Primary move"
        - name: move_2
          description: "Secondary move"
        - name: move_3
          description: "Third move"
        - name: move_4
          description: "Fourth move"

  - name: int_pokemon_stats
    description: "What stats do all pokemon have at any level? Pre-calculated Generation 1 stats for all pokemon at levels 1-100."
    columns:
        - name: id
          description: "Unique identifier generated from pokemon and level"
        - name: pokedex
          description: "Pokedex number"
        - name: pokemon
          description: "Pokemon species name"
        - name: pkmn_level
          description: "Pokemon level (1-100)"
        - name: type1
          description: "Primary pokemon type"
        - name: type2
          description: "Secondary pokemon type (null for single-type)"
        - name: calculated_hp
          description: "HP stat calculated using Generation 1 formula"
        - name: calculated_attack
          description: "Attack stat calculated using Generation 1 formula"
        - name: calculated_defence
          description: "Defence stat calculated using Generation 1 formula"
        - name: calculated_special
          description: "Special stat calculated using Generation 1 formula"
        - name: calculated_speed
          description: "Speed stat calculated using Generation 1 formula"
        - name: base_hp
          description: "Base HP stat from species data"
        - name: base_attack
          description: "Base Attack stat from species data"
        - name: base_defence
          description: "Base Defence stat from species data"
        - name: base_special
          description: "Base Special stat from species data"
        - name: base_speed
          description: "Base Speed stat from species data"
        - name: calculated_total
          description: "Sum of all calculated stats"

  - name: int_level_exp_requirements
    description: "Total EXP required and EXP to next level for every level (1-100) and growth rate combination."
    columns:
        - name: level
          description: "Pokemon level (1-100)"
        - name: growth_rate
          description: "Experience growth rate category (fast, medium_fast, medium_slow, slow)"
        - name: total_exp_required
          description: "Cumulative experience points needed to reach this level"
        - name: exp_to_next_level
          description: "Experience points needed to advance from this level to the next (NULL at level 100)"

  - name: int_pkmn_exp_data
    description: "Pokemon species data enriched with growth rate and base experience yield for EXP calculations."
    columns:
        - name: pokedex
          description: "Pokedex number"
        - name: pokemon
          description: "Pokemon species name"
        - name: hp
          description: "Base HP stat"
        - name: attack
          description: "Base Attack stat"
        - name: defence
          description: "Base Defence stat"
        - name: special
          description: "Base Special stat"
        - name: speed
          description: "Base Speed stat"
        - name: total
          description: "Base stat total"
        - name: type1
          description: "Primary pokemon type"
        - name: type2
          description: "Secondary pokemon type"
        - name: growth_rate
          description: "Experience growth rate category"
        - name: base_exp
          description: "Base experience points yielded when defeated"
        - name: max_exp_to_100
          description: "Total experience points required to reach level 100 for this growth rate"

  - name: int_encounter_lookup
    description: "Where can I catch any Pokemon? Pre-joined encounter data for agent queries, one row per (pokemon, map, area)."
    columns:
        - name: id
          description: "Surrogate key from pokemon, map_name, area"
          tests:
            - unique
            - not_null
        - name: species_key
          description: "Canonical join key (UPPER, alphanumeric-only) for the encounterable species. Lets the agent bind raw emulator species without string surgery (issue #17)."
        - name: nav_map_name
          description: "Matching map name in the navigation tile data (stg_nav_map_tiles)"
          tests:
            - not_null

  - name: int_navigation_guide
    description: "Step-by-step navigation guide enriched with map dimensions, available exits, and next-step preview. Query by map_name and order by step_order."
    columns:
        - name: route_section
          description: "Walkthrough section (title_screen, bedroom_exit, pallet_to_oak, etc.)"
        - name: step_order
          description: "Sequential step number"
          tests:
            - unique
            - not_null
        - name: map_name
          description: "Map where this step takes place"
        - name: target_x
          description: "Target X coordinate"
        - name: target_y
          description: "Target Y coordinate"
        - name: action
          description: "Action type (press, move, use_warp, interact, battle, wait, checkpoint)"
        - name: action_detail
          description: "Specific instructions"
        - name: expected_result
          description: "Expected outcome after this step"
        - name: notes
          description: "Additional tips"
        - name: map_width
          description: "Width of current map in blocks"
        - name: map_height
          description: "Height of current map in blocks"
        - name: area_type
          description: "Type of area (town, city, route, indoor, dungeon, gate)"
        - name: parent_area
          description: "Parent town/city for indoor locations"
        - name: available_exits
          description: "Aggregated string of all exits from this map with coordinates and destinations"
        - name: next_map
          description: "Map name of the next step"
        - name: next_action
          description: "Action type of the next step"
        - name: next_action_detail
          description: "Instructions for the next step"

  - name: int_map_connections
    description: "Map-to-map connection reference with navigation instructions. Query by from_map to find all exits from a location."
    columns:
        - name: id
          description: "Surrogate key for the warp connection"
          tests:
            - unique
            - not_null
        - name: from_map
          description: "Source map name"
        - name: from_x
          description: "X coordinate of warp on source map"
        - name: from_y
          description: "Y coordinate of warp on source map"
        - name: to_map
          description: "Destination map name"
        - name: to_x
          description: "X coordinate on destination map"
        - name: to_y
          description: "Y coordinate on destination map"
        - name: warp_type
          description: "Type of connection (door, stairs, gate, edge)"
        - name: notes
          description: "Description of the connection"
        - name: from_map_width
          description: "Width of source map"
        - name: from_map_height
          description: "Height of source map"
        - name: from_area_type
          description: "Area type of source map"
        - name: to_map_width
          description: "Width of destination map"
        - name: to_map_height
          description: "Height of destination map"
        - name: to_area_type
          description: "Area type of destination map"
        - name: navigation_instruction
          description: "Human-readable instruction for using this connection"

  - name: int_map_pathfinding
    description: "Walkable tile adjacency graph per map. For each walkable tile, lists which neighboring tiles can be reached and in which direction, accounting for walls (blocked), ledges (one-way), and grass (encounter risk). Grain: one row per (map_name, from_x, from_y, direction)."
    columns:
        - name: map_name
          description: "Memory reader enum name for the map, part of the composite grain"
        - name: from_x
          description: "X coordinate of the source tile, part of the composite grain"
        - name: from_y
          description: "Y coordinate of the source tile, part of the composite grain"
        - name: from_tile_type
          description: "Terrain type of the source tile"
        - name: to_x
          description: "X coordinate of the destination tile"
        - name: to_y
          description: "Y coordinate of the destination tile"
        - name: to_tile_type
          description: "Terrain type of the destination tile"
        - name: direction
          description: "Movement direction from source to destination (up, down, left, right), part of the composite grain"
        - name: is_passable
          description: "Whether this edge can be traversed (always TRUE in output; impassable ledge entries are filtered out)"
        - name: has_encounter_risk
          description: "Whether the destination tile is grass (wild encounter risk)"

  - name: int_map_components
    description: "Weakly-connected components of each map's walkable graph. Labels every walkable tile with a subregion_id so consumers can tell an intentional split map (e.g. ROUTE_2's north/south halves) from a genuine data hole. Components are undirected: one-way ledge drops are treated as ordinary connectivity."
    columns:
        - name: map_name
          description: "Memory reader enum name for the map"
        - name: x
          description: "Tile X coordinate"
        - name: y
          description: "Tile Y coordinate"
        - name: subregion_id
          description: "0-based component label, stable per map (components ordered by their smallest tile)"
        - name: component_size
          description: "Number of walkable tiles in this tile's component"
